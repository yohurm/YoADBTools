<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yohu ADB Tools</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <style>
      /* 隐藏主窗 hydrate 时铺 --yohu-bg-base，避免 WebView 闪底。用户可见品牌在原生小窗。 */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #f1f3f5;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #000000;
      }
      #yohu-boot {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: #f1f3f5;
      }
      html[data-theme="dark"] #yohu-boot {
        background: #000000;
      }
    </style>
    <script src="/boot-theme.js"></script>
  </head>
  <body>
    <div id="yohu-boot" role="status" aria-live="polite" aria-busy="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
