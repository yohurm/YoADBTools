<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yohu ADB Tools</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <style>
      /* 隐藏主窗 hydrate 时铺画布，避免 WebView 闪底。用户可见品牌在原生小窗。
         裸色值只作 --yohu-canvas 未定义时的首帧 fallback；token 一旦入场即胜出。
         禁止 OLED #000000。深色 fallback = DarkColors.BgBase / CANVAS_DARK。 */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background-color: var(--yohu-canvas, #F1F3F5);
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background-color: var(--yohu-canvas, #191A1C);
      }
      #yohu-boot {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background-color: var(--yohu-canvas, #F1F3F5);
      }
      html[data-theme="dark"] #yohu-boot {
        background-color: var(--yohu-canvas, #191A1C);
      }
    </style>
    <script src="/boot-theme.js"></script>
  </head>
  <body>
    <div id="yohu-boot" role="status" aria-live="polite" aria-busy="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
