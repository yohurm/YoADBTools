name: CI

# Yohu ADB Tools v6 — 持续集成与发布流水线（架构文档 §11.3；ADR-v6-045）
# 触发：push / PR 到 main；手动 workflow_dispatch。
# 验收门槛与 CLAUDE.md「发布检查清单」一致（1/2/3/7 项自动化）。
# 验证：Windows / macOS / Linux。打包：NSIS / DMG / deb（仅 push 与手动，PR 不打）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: 验证（Rust + 前端）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb（下载官方 platform-tools）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-adb.ps1

      - name: sidecar scrcpy-server（投屏资源）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-scrcpy-server.ps1

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        working-directory: ui
        run: pnpm exec tsc -b

      - name: 前端测试（Vitest）
        working-directory: ui
        run: pnpm test

      - name: token 纪律（ADR-v6-011：禁硬编码色值/字号）
        working-directory: ui
        run: pnpm lint

      - name: 前端生产构建（PR 也校验可构建；体积断言在 package）
        working-directory: ui
        run: pnpm build

      - name: Rust 构建（含 fake-adb 明文 bin）
        run: cargo build --workspace

      - name: Rust 测试（含 fake-adb 集成）
        run: cargo test --workspace

      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

  verify-macos:
    name: 验证 macOS（Rust + 前端）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb
        run: bash scripts/setup-adb.sh

      - name: sidecar scrcpy-server
        run: bash scripts/setup-scrcpy-server.sh

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        working-directory: ui
        run: pnpm exec tsc -b

      - name: 前端测试（Vitest）
        working-directory: ui
        run: pnpm test

      - name: token 纪律
        working-directory: ui
        run: pnpm lint

      - name: Rust 构建（含 fake-adb 明文 bin）
        run: cargo build --workspace

      - name: Rust 测试（含 fake-adb 集成）
        run: cargo test --workspace

      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

  verify-linux:
    name: 验证 Linux（Rust + 前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: WebKitGTK 与打包依赖
        run: bash scripts/setup-linux-deps.sh

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb
        run: bash scripts/setup-adb.sh

      - name: sidecar scrcpy-server
        run: bash scripts/setup-scrcpy-server.sh

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: 前端类型检查
        working-directory: ui
        run: pnpm exec tsc -b

      - name: 前端测试（Vitest）
        working-directory: ui
        run: pnpm test

      - name: token 纪律
        working-directory: ui
        run: pnpm lint

      - name: Rust 构建（含 fake-adb 明文 bin）
        run: cargo build --workspace

      - name: Rust 测试（含 fake-adb 集成）
        run: cargo test --workspace

      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    name: 打包（NSIS）
    runs-on: windows-latest
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-adb.ps1

      - name: sidecar scrcpy-server（投屏资源）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-scrcpy-server.ps1

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 前端依赖 + 构建
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: tauri-cli
        run: cargo install tauri-cli --locked

      - name: 打包 NSIS
        working-directory: app/yohu-adbtools
        run: cargo tauri build

      - name: 记录安装包体积
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path target, app -Recurse -Filter "*setup.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) { throw "未找到安装包产物" }
          $mb = [math]::Round($setup.Length / 1MB, 2)
          Write-Host "安装包：$($setup.FullName) = $mb MB"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: YohuAdbTools-windows-nsis
          path: |
            target/**/nsis/*setup.exe
            app/**/nsis/*setup.exe
          if-no-files-found: error

  package-linux:
    name: 打包（deb）
    runs-on: ubuntu-latest
    needs: verify-linux
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: WebKitGTK 与打包依赖
        run: bash scripts/setup-linux-deps.sh

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb
        run: bash scripts/setup-adb.sh

      - name: sidecar scrcpy-server
        run: bash scripts/setup-scrcpy-server.sh

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 前端依赖 + 构建
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: tauri-cli
        run: cargo install tauri-cli --locked

      - name: 打包 deb
        working-directory: app/yohu-adbtools
        run: cargo tauri build

      - name: 校验约定文件名并记录体积
        run: |
          set -euo pipefail
          deb="$(find target app -path '*/bundle/deb/*.deb' -type f | sort | tail -n 1)"
          if [[ -z "$deb" ]]; then
            echo "未找到 .deb 产物" >&2
            find target app -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          base="$(basename "$deb")"
          if [[ ! "$base" =~ ^YohuAdbTools_[0-9]+\.[0-9]+\.[0-9]+_amd64\.deb$ ]]; then
            echo "deb 文件名不符合约定（期望 YohuAdbTools_X.Y.Z_amd64.deb）：$base" >&2
            exit 1
          fi
          mb="$(du -h "$deb" | awk '{print $1}')"
          echo "安装包：$deb = $mb"
          mkdir -p dist-ci
          cp -f "$deb" "dist-ci/$base"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: YohuAdbTools-linux-deb
          path: dist-ci/*.deb
          if-no-files-found: error

  package-macos:
    name: 打包（DMG）
    runs-on: macos-latest
    needs: verify-macos
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: sidecar adb
        run: bash scripts/setup-adb.sh

      - name: sidecar scrcpy-server
        run: bash scripts/setup-scrcpy-server.sh

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: 前端依赖 + 构建
        working-directory: ui
        run: pnpm install --frozen-lockfile && pnpm build

      - name: tauri-cli
        run: cargo install tauri-cli --locked

      # 未配置 Apple Developer 证书 / 公证时产出未签名 DMG（ADR-v6-045）。
      # 勿设置空的 APPLE_* / TAURI_SIGNING_*，以免 bundler 误入签名路径。
      - name: 打包 DMG（未签名）
        working-directory: app/yohu-adbtools
        run: cargo tauri build

      - name: 校验约定文件名并记录体积
        run: |
          set -euo pipefail
          dmg="$(find target app -path '*/bundle/dmg/*.dmg' -type f | sort | tail -n 1)"
          if [[ -z "$dmg" ]]; then
            echo "未找到 .dmg 产物" >&2
            find target app -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          base="$(basename "$dmg")"
          # macos-latest 现为 arm64 → aarch64；若 runner 为 Intel 则 x64。
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) expect_re='^YohuAdbTools_[0-9]+\.[0-9]+\.[0-9]+_aarch64\.dmg$' ;;
            x86_64) expect_re='^YohuAdbTools_[0-9]+\.[0-9]+\.[0-9]+_x64\.dmg$' ;;
            *) echo "未知 macOS 架构：$arch" >&2; exit 1 ;;
          esac
          if [[ ! "$base" =~ $expect_re ]]; then
            echo "dmg 文件名不符合约定（arch=$arch）：$base" >&2
            exit 1
          fi
          size_h="$(du -h "$dmg" | awk '{print $1}')"
          echo "installer=$dmg size=$size_h unsigned=ADR-v6-045"
          mkdir -p dist-ci
          cp -f "$dmg" "dist-ci/$base"

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: YohuAdbTools-macos-dmg
          path: dist-ci/*.dmg
          if-no-files-found: error
